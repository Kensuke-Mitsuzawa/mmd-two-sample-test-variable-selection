detection_approaches = ["interpretable_mmd", "wasserstein_independence"]
# ram is the faster. flexible-file is slower, but less RAM-memory burden.
dataset_type_backend = "ram"

[base]
    file_name_sqlite3 = "exp_result.sqlite3"
    name_experiment_db = "experiment.json"

    # Rewriting the path here!
    path_experiment_root = "/root/mmd-two-sample-test-variable-selection/demos/demo_face_cat_dog/cat_and_dogs"
    dir_name_data = "data"
    dir_models = "models"
    dir_logs = "logs"

[computational_resource]
    # 'gpu' (or 'cuda') for GPU execution, 'cpu' for CPU execution
    train_accelerator = "gpu"

    # 'dask' enables concurrent-GPU multi-slot execution via ConcurrentGpuTaskDispatcher and NVIDIA MPS.
    # Set to 'single' for sequential execution.
    distributed_mode = "dask"
    k_slots_per_gpu = "auto"
    dask_n_workers = 2
    dask_threads_per_worker = 1
    dask_scheduler_host = "0.0.0.0"
    dask_scheduler_port = 8786
    dask_dashboard_address = ":8787"
    # Set to 0 to disable Dask memory budget worker termination (prevents killing PyTorch GPU workers)
    dask_memory_limit = 0

[approach]
    approach_data_representation = "sample_based"
    approach_interpretable_mmd = "cv_selection"

[mmd_optimization]
    trainer_backend = "pure_pytorch"
    matrix_computation = "auto"

[data_setting]
    target_image_size = [32, 32]

    data_mode = "cat_and_dogs"
    # comment: replace these following paths below. To the directory where your AFHQ dataset exist.
    path_dir_data_source_x = "/root/mmd-two-sample-test-variable-selection/demos/demo_face_cat_dog/cat_and_dogs/animal_faces/data/afhq/train/cat"
    path_dir_data_source_y = "/root/mmd-two-sample-test-variable-selection/demos/demo_face_cat_dog/cat_and_dogs/animal_faces/data/afhq/train/dog"
    file_extension = 'jpg'

    file_name_x = "x.pt"
    file_name_y = "y.pt"


[data_generation]
    sample_size_train = 200
    sample_size_test = 200



[mmd_baseline]
    devices = 'auto'
    MAX_EPOCH = 9999


[cv_selection]
    MAX_EPOCH = 9999
    candidate_regularization_parameter = 'auto'
    n_regularization_parameter = 5

    n_subsampling = 10
