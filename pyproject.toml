[project]
name = "mmd_tst_variable_detector"
version = "1.6.2"
description = "MMD Two-Sample Test Variable Selection"
readme = "README.md"
authors = [
    { name = "Kensuke Mitsuzawa", email = "kensuke.mit@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.2,<2.0.0",
    "torch==2.5.1+cu121",
    "scikit-learn",
    "pytorch-lightning",
    "pot",
    "joblib",
    "jupyter>=1.0.0",
    "seaborn>=0.12.2",
    "dask==2023.5.0",
    "distributed",
    "uniplot",
    "mlflow>=2.0.0,<3.16.0",
    "grpcio",
    "optuna>=3.4.0",
    "tinydb>=4.8.0",
    "plotly>=5.18.0",
    "logzero",
    "dacite>=1.8.1",
    "more-itertools",
    "tensorboard>2.0.0",
    "frozendict>=2.3.9",
    "trendfilter>=0.2.1",
    "xarray>=2024.1.1",
    "pandera>=0.18.3",
    "toml>=0.10.2",
    "openpyxl",
    "geomloss>=0.2.6",
    "gputil>=1.4.0",
]

[project.optional-dependencies]
dask_visual = [
    "bokeh==2.4.2",
]
experiment_compare = [
    "future",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-resource-path>=1.4.1",
    "typeguard>=4.4.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mmd_tst_variable_detector*"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
